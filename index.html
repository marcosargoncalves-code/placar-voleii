<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Placar de Vôlei - LiveNow / OBS</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;700&display=swap');

    :root {
      --purple-dark: #1a0c36;
      --purple-main: #4a148c;
      --purple-deep: #311b92;
      --yellow: #ffeb3b;
      --red: #ff5252;
      --white: #ffffff;
      --panel-bg: rgba(0, 0, 0, 0.88);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: Roboto, Arial, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 20px;
    }

    .scoreboard-container {
      display: flex;
      align-items: center;
      height: 60px;
      max-width: calc(100vw - 20px);
      filter: drop-shadow(0 8px 16px rgba(0,0,0,.35));
      user-select: none;
      white-space: nowrap;
    }

    .team-block {
      display: flex;
      align-items: center;
      height: 100%;
      min-width: 155px;
      padding: 0 15px;
      gap: 12px;
      color: white;
      background: linear-gradient(90deg, var(--purple-main), var(--purple-deep));
    }

    .team-b-block {
      justify-content: flex-end;
      background: linear-gradient(90deg, var(--purple-deep), var(--purple-main));
    }

    .team-name {
      min-width: 70px;
      font-family: Oswald, Impact, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1;
      text-transform: uppercase;
    }

    .team-logo {
      width: 40px;
      height: 40px;
      object-fit: contain;
      border-radius: 4px;
      background: rgba(255,255,255,.08);
    }

    .sets-block {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100%;
      min-width: 50px;
      color: white;
      background: var(--purple-dark);
      border-bottom: 3px solid white;
    }

    .team-b-sets { border-bottom-color: var(--yellow); }

    .sets-label {
      margin-bottom: 2px;
      font-size: 9px;
      font-weight: 700;
      opacity: .72;
      text-transform: uppercase;
    }

    .sets-score {
      font-family: Oswald, Impact, sans-serif;
      font-size: 22px;
      font-weight: 700;
    }

    .points-block {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-width: 58px;
      padding: 0 7px;
      color: white;
      background: var(--purple-main);
      font-family: Oswald, Impact, sans-serif;
      font-size: 36px;
      font-weight: 700;
    }

    .logo-center {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-width: 86px;
      padding: 0 15px;
      color: var(--red);
      background: var(--purple-deep);
      font-family: Oswald, Impact, sans-serif;
      font-size: 24px;
      font-style: italic;
      font-weight: 700;
      text-transform: uppercase;
    }

    .control-panel {
      display: none;
      margin-top: 30px;
      padding: 20px;
      gap: 25px;
      color: white;
      background: var(--panel-bg);
      border-radius: 12px;
    }

    body.show-controls .control-panel { display: flex; }

    .control-group {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .control-group label {
      color: #ccc;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .btn-row { display: flex; gap: 5px; }

    button {
      min-width: 42px;
      padding: 6px 14px;
      color: white;
      background: var(--purple-main);
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
    }

    .btn-clear { background: #d32f2f; }

    input[type="text"], input[type="url"] {
      width: 95px;
      padding: 4px;
      color: white;
      background: #222;
      border: 1px solid #444;
      border-radius: 4px;
      font-weight: 700;
      text-align: center;
    }

    .url-input {
      width: 170px !important;
      font-size: 10px;
    }
  </style>
</head>

<body>
  <main class="scoreboard-container">
    <section class="team-block">
      <img class="team-logo" id="logoA-display" src="https://livenow.nabiapp.com/app_assets/images/placeholder_team_1.png" />
      <div class="team-name" id="teamA-display">HOME</div>
    </section>

    <section class="sets-block">
      <div class="sets-label">Sets</div>
      <div class="sets-score" id="setsA-display">0</div>
    </section>

    <section class="points-block" id="pointsA-display">0</section>

    <section class="logo-center" id="logo-display">VNL</section>

    <section class="points-block" id="pointsB-display">0</section>

    <section class="sets-block team-b-sets">
      <div class="sets-label">Sets</div>
      <div class="sets-score" id="setsB-display">0</div>
    </section>

    <section class="team-block team-b-block">
      <div class="team-name" id="teamB-display">AWAY</div>
      <img class="team-logo" id="logoB-display" src="https://livenow.nabiapp.com/app_assets/images/placeholder_team_2.png" />
    </section>
  </main>

  <aside class="control-panel">
    <div class="control-group">
      <label>Nome Time A</label>
      <input type="text" id="nameA-input" value="HOME" maxlength="12" />

      <label>URL Escudo A</label>
      <input type="url" class="url-input" id="urlA-input" value="https://livenow.nabiapp.com/app_assets/images/placeholder_team_1.png" />

      <label>Pontos A</label>
      <div class="btn-row">
        <button data-field="pointsA" data-amount="-1">-</button>
        <button data-field="pointsA" data-amount="1">+</button>
      </div>

      <label>Sets A</label>
      <div class="btn-row">
        <button data-field="setsA" data-amount="-1">-</button>
        <button data-field="setsA" data-amount="1">+</button>
      </div>
    </div>

    <div class="control-group">
      <label>Logo Central</label>
      <input type="text" id="logo-input" value="VNL" maxlength="12" />
      <button class="btn-clear" id="reset-button">Zerar Tudo</button>
    </div>

    <div class="control-group">
      <label>Nome Time B</label>
      <input type="text" id="nameB-input" value="AWAY" maxlength="12" />

      <label>URL Escudo B</label>
      <input type="url" class="url-input" id="urlB-input" value="https://livenow.nabiapp.com/app_assets/images/placeholder_team_2.png" />

      <label>Pontos B</label>
      <div class="btn-row">
        <button data-field="pointsB" data-amount="-1">-</button>
        <button data-field="pointsB" data-amount="1">+</button>
      </div>

      <label>Sets B</label>
      <div class="btn-row">
        <button data-field="setsB" data-amount="-1">-</button>
        <button data-field="setsB" data-amount="1">+</button>
      </div>
    </div>
  </aside>

  <script>
    const STORAGE_KEY = 'placar_volei_livenow_obs_v1';

    const defaultState = {
      pointsA: 0,
      pointsB: 0,
      setsA: 0,
      setsB: 0,
      nameA: 'HOME',
      nameB: 'AWAY',
      centerLogo: 'VNL',
      logoA: 'https://livenow.nabiapp.com/app_assets/images/placeholder_team_1.png',
      logoB: 'https://livenow.nabiapp.com/app_assets/images/placeholder_team_2.png'
    };

    let state = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        return saved ? { ...defaultState, ...JSON.parse(saved) } : { ...defaultState };
      } catch {
        return { ...defaultState };
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function clampScore(value) {
      return Math.max(0, Number(value) || 0);
    }

    function shortName(value) {
      return String(value || '').trim().toUpperCase().slice(0, 4) || '----';
    }

    function updateDisplay() {
      document.getElementById('pointsA-display').textContent = state.pointsA;
      document.getElementById('pointsB-display').textContent = state.pointsB;
      document.getElementById('setsA-display').textContent = state.setsA;
      document.getElementById('setsB-display').textContent = state.setsB;
      document.getElementById('teamA-display').textContent = shortName(state.nameA);
      document.getElementById('teamB-display').textContent = shortName(state.nameB);
      document.getElementById('logo-display').textContent = String(state.centerLogo || 'VNL').toUpperCase();
      document.getElementById('logoA-display').src = state.logoA || defaultState.logoA;
      document.getElementById('logoB-display').src = state.logoB || defaultState.logoB;

      document.getElementById('nameA-input').value = state.nameA;
      document.getElementById('nameB-input').value = state.nameB;
      document.getElementById('logo-input').value = state.centerLogo;
      document.getElementById('urlA-input').value = state.logoA;
      document.getElementById('urlB-input').value = state.logoB;
    }

    function changeValue(field, amount) {
      state[field] = clampScore((state[field] || 0) + amount);
      saveState();
      updateDisplay();
    }

    function resetScoreboard() {
      state.pointsA = 0;
      state.pointsB = 0;
      state.setsA = 0;
      state.setsB = 0;
      saveState();
      updateDisplay();
    }

    document.querySelectorAll('button[data-field]').forEach(button => {
      button.addEventListener('click', () => {
        changeValue(button.dataset.field, Number(button.dataset.amount));
      });
    });

    document.getElementById('reset-button').addEventListener('click', resetScoreboard);

    document.getElementById('nameA-input').addEventListener('input', e => {
      state.nameA = e.target.value;
      saveState();
      updateDisplay();
    });

    document.getElementById('nameB-input').addEventListener('input', e => {
      state.nameB = e.target.value;
      saveState();
      updateDisplay();
    });

    document.getElementById('logo-input').addEventListener('input', e => {
      state.centerLogo = e.target.value;
      saveState();
      updateDisplay();
    });

    document.getElementById('urlA-input').addEventListener('input', e => {
      state.logoA = e.target.value;
      saveState();
      updateDisplay();
    });

    document.getElementById('urlB-input').addEventListener('input', e => {
      state.logoB = e.target.value;
      saveState();
      updateDisplay();
    });

    const params = new URLSearchParams(window.location.search);
    if (params.get('control') === '1' || params.get('controls') === '1') {
      document.body.classList.add('show-controls');
    }

    updateDisplay();
  </script>
</body>
</html>
